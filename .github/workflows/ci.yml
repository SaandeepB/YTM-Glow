name: CI

# Runs on every branch push (PRs pick up the checks of their head commit),
# so there's no duplicate pull_request run.
on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    # Build and test only; no signing secrets, no releases.
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Swift build
        run: swift build

      - name: Swift tests
        run: swift test

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extension unit tests
        working-directory: extension-tests
        run: npm test

      - name: Build and ad-hoc sign the app bundle
        run: scripts/build-app.sh
